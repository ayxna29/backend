services:
  - type: web
    name: ConnectAAC
    env: node
    plan: free
    repo: https://github.com/ayxna29/backend
    branch: main
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: SUPABASE_URL
        value: ""      # Set the actual URL in Render UI
        scope: RUN_TIME
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""      # Set the actual key in Render UI
        scope: RUN_TIME
      - key: OPENAI_API_KEY
        value: ""      # Optional, set in Render UI if used
        scope: RUN_TIME
      - key: OPENSYMBOLS_SECRET
        value: ""      # Required for real symbol images — without it every card falls back to blank/local-only matching. Set in Render UI (same value as your local .env).
        scope: RUN_TIME
      - key: WEBHOOK_SECRET
        value: ""      # Optional, set in Render UI if used
        scope: RUN_TIME
      - key: FRONTEND_ORIGIN
        value: "https://connectaac-frontend.onrender.com"      # Must match the deployed frontend's exact origin (no trailing slash) or every browser request gets CORS-blocked
        scope: RUN_TIME
